# SPDX-License-Identifier: MPL-2.0
# This constrains Mergify only. Manual merges need the strict repository rule
# in .github/rulesets/rust-integration.json applied by an administrator.
# See docs/verification/issue-171-electrical-ids.md and DR-0004.
{
  merge_protections_settings: {
    auto_merge_conditions: [
      "author = dependabot[bot]",
      # Actions updates need a reviewed actions.lock regeneration first.
      "head ~= ^dependabot/cargo/",
      "#check-failure = 0",
      "#check-neutral = 0",
      # A passing old head is insufficient after another PR changes main (#171).
      "#commits-behind = 0",
      # Positive results catch missing, skipped, pending and startup-failed jobs.
      # Do not wait for every optional third-party check with #check-pending = 0.
      "check-success = actions.lock is in sync with the workflow YAML",
      "check-success = test-ghost (core/tui/ffi + clippy + fmt)",
      "check-success = fixtures-and-must (shell suites + Mustfile probes)",
    ],
  },
}
