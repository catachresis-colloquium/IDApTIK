# TEMPORARY diagnostics probe for the Evil Weevil branch — delete before merge.
# This workflow exists because the authoring sandbox cannot reach Actions log
# storage, so compiler/rustfmt output is mirrored into the job summary (which
# the checks API exposes). It adds no `uses:` reference and runs no gate.
name: Arena diagnostics probe

on:
  push:
    branches: ["arena/cb226ff1-idaptik"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach --force FETCH_HEAD
      - name: Provision pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Collect rustfmt, compile and clippy diagnostics
        run: |
          set +e
          {
            echo "## rustfmt --check"
            echo '```diff'
            cargo fmt --all -- --check 2>&1
            echo '```'
            echo "## cargo test --no-run (idaptik-evil-weevil)"
            echo '```'
            cargo test -p idaptik-evil-weevil --no-run 2>&1
            echo '```'
            echo "## cargo clippy -D warnings (idaptik-evil-weevil)"
            echo '```'
            cargo clippy -p idaptik-evil-weevil --all-targets -- -D warnings 2>&1
            echo '```'
            echo "## cargo test --no-run (idaptik-net, relay test)"
            echo '```'
            cargo test -p idaptik-net --no-run 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>&1
          exit 0
