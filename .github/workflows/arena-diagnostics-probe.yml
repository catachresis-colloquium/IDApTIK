# TEMPORARY diagnostics probe for the Evil Weevil branch — delete before merge.
# The authoring sandbox cannot reach Actions log storage, so this job applies
# rustfmt and writes compiler/clippy diagnostics into a committed file, then
# pushes back to the branch where they can be read directly. It adds no
# `uses:` reference and is not a gate.
name: Arena diagnostics probe

on:
  push:
    branches: ["arena/cb226ff1-idaptik"]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the branch
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          git config user.name "arena-diagnostics-bot"
          git config user.email "arena-diagnostics-bot@users.noreply.github.com"
      - name: Provision pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Apply rustfmt and capture compile/clippy diagnostics
        run: |
          set +e
          mkdir -p .arena-diagnostics
          cargo fmt --all
          cargo test -p idaptik-evil-weevil --no-run > .arena-diagnostics/compile.txt 2>&1
          echo "exit=$?" >> .arena-diagnostics/compile.txt
          cargo clippy -p idaptik-evil-weevil --all-targets -- -D warnings \
            > .arena-diagnostics/clippy.txt 2>&1
          echo "exit=$?" >> .arena-diagnostics/clippy.txt
          cargo test -p idaptik-net --no-run > .arena-diagnostics/net-compile.txt 2>&1
          echo "exit=$?" >> .arena-diagnostics/net-compile.txt
          exit 0
      - name: Commit formatting and diagnostics back to the branch
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(arena): apply rustfmt and record compile/clippy diagnostics"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
