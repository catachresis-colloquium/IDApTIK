# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
#
# ── WHY THESE `uses:` REFS ARE READABLE TAGS, NOT BARE SHAs ─────────────────
#
# `.github/workflows/actions.lock` is authoritative for what actually runs. It
# records, per workflow path, the `uses:` refs that workflow may carry, and for
# each of those the resolved 40-hex commit. GitHub enforces that at STARTUP: a
# step-level ref in a lock-managed workflow that the lockfile does not record
# under that same path makes the run unstartable -- zero jobs are created and
# the run reports only "This run likely failed because of a workflow file
# issue." There is no red X on any job, because no job ever existed.
#
# That is not hypothetical here. PR #143 rewrote both refs below from
# `@v4.38.0` to a bare commit SHA in the name of pinning harder. The lockfile
# still recorded `github/codeql-action@v4.38.0`, so every CodeQL run from
# 2026-09-23T10:38Z to the fix rendered NO VERDICT AT ALL on the commit --
# while `code_scanning` is a required rule on `main`, so the org ruleset was
# being satisfied by a gate that had silently stopped existing.
#
# So: the workflow carries the readable ref, the lockfile carries the commit.
# Writing a SHA here does not pin anything harder; it desynchronises the two
# files and kills the workflow. To move the version, bump BOTH together and run
# `just lock-sync-check` (or `scripts/check-lock-sync.sh`) before pushing.
# `.github/workflows/lock-sync-gate.yml` fails the pull request if you forget,
# and that gate carries no `uses:` of its own so it cannot die the same way.
name: CodeQL Security Analysis
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 1 * *'   # monthly 1st 06:00 UTC (Actions burn cut, standards#288)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach --force FETCH_HEAD
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
