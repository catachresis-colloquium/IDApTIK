# TEMPORARY authoring aid. The authoring sandbox has no Rust toolchain and
# cannot reach the blob host the Actions log API redirects to, so this job
# compiles the branch on the pinned toolchain and pushes what the tools said to
# a side branch the sandbox *can* fetch. It carries no `uses:` refs, so the
# lockfile gate cannot desync on it. Delete it before this branch is proposed.
name: arena-probe

on:
  push:
    branches:
      - arena/4da69a97-idaptik
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch the branch
        run: |
          set -eu
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" work
          cd work
          git log --oneline -1

      - name: Provision pinned Rust toolchain
        working-directory: work
        run: rustup show

      - name: Collect diagnostics
        working-directory: work
        run: |
          set +e
          mkdir -p feedback
          cargo check -p idaptik-core -p idaptik-tui -p idaptik-net -p idaptik-ffi -p idaptik-evil-weevil \
            --all-targets --keep-going --message-format=short > feedback/check.txt 2>&1
          echo "check exit: $?" >> feedback/check.txt
          cargo clippy -p idaptik-core -p idaptik-tui -p idaptik-net -p idaptik-evil-weevil \
            --all-targets --keep-going --message-format=short -- -D warnings > feedback/clippy.txt 2>&1
          echo "clippy exit: $?" >> feedback/clippy.txt
          cargo test -p idaptik-core -p idaptik-tui -p idaptik-ffi -p idaptik-net -p idaptik-evil-weevil \
            --no-fail-fast > feedback/test.txt 2>&1
          echo "test exit: $?" >> feedback/test.txt
          cargo fmt --all -- --check > feedback/fmt-check.txt 2>&1
          echo "fmt exit: $?" >> feedback/fmt-check.txt
          cargo fmt --all
          git diff > feedback/fmt.patch
          wc -l feedback/*.txt feedback/fmt.patch

      - name: Publish the diagnostics to a side branch
        working-directory: work
        run: |
          set -eu
          git config user.name "arena-probe"
          git config user.email "arena-probe@users.noreply.github.com"
          git checkout -b arena-probe-out
          git add -A feedback
          git commit --no-verify -m "chore: probe output for ${GITHUB_SHA}"
          git push --no-verify --force origin HEAD:refs/heads/arena/feedback-4da69a97
