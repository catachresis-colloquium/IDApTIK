# SPDX-License-Identifier: MPL-2.0
#
# Secret scanning for IDApTIK.
#
# ── Why this is first-party, not the estate reusable ────────────────────────
#
# Until now this job called
# `metadatastician/standards/.github/workflows/secret-scanner-reusable.yml`.
# That caller was added in #212 (2026-10-31) and NEVER STARTED ONCE: every run
# reports `startup_failure`, no job appears, and no check run is created at all
# -- so `gh pr checks` shows nothing and the REQUIRED context `scan / gitleaks`
# never arrives. Every pull request in this repository waits for it forever.
#
# It is not this repository's YAML: the caller and its pin are byte-identical to
# the version that last succeeded on 2026-10-27, the reusable at the pinned ref
# is the already-fixed least-privilege revision, and it only consumes
# `actions/checkout@3d3c42e5`, which this repository's actions.lock already
# declares. The remaining explanations are all policy-side: a cross-OWNER
# reusable now that `standards` has moved from `hyperpolymath` to
# `metadatistician`, or an org-wide action allowlist. The org settings are not
# readable with this repository's token, and a required gate must not hinge on
# another repository's settings page.
#
# ── The context name is deliberate ──────────────────────────────────────────
#
# The branch protection rule on `main` requires a check named `scan / gitleaks`
# -- the shape a reusable call produces (`<caller job> / <called job>`). This
# job is named exactly that, so the protection rule keeps matching and no
# maintainer has to touch the ruleset. It is a real gitleaks run, not a stub.
#
# ── What it scans, and why that is MORE than the old gate ───────────────────
#
# `scripts/secret_scan.sh` enumerates every blob reachable from any fetched ref
# and scans each distinct (blob, path) pair. The reusable scanned the WORKING
# TREE, which cannot see a secret that was committed and later deleted -- the
# usual way a leak survives: the string is gone, so nobody remembers to rotate
# it. Deleting a file does not delete the blob.
#
# ── Why it is still fast: content-addressed skipping ────────────────────────
#
# A blob is a content hash, and its verdict depends only on its bytes, its path
# and the scanner (binary + rules). `scripts/lib/content-cache.sh` records
# `blob-sha <TAB> path` once proven clean under a scanner epoch that covers the
# binary digest and the ruleset digest; the next run materialises and scans only
# new pairs. A rules change invalidates everything, by construction.
#
# Measured in this repository (660 blobs of history, stub scanner, 2 vCPU):
#   cold  3.25 s   (enumerate + materialise + scan)
#   warm  0.10 s   (enumerate + partition; no scanner invocation at all)
# so the cache removes the per-run cost and the scanner only ever sees deltas.
# Findings are never recorded as clean, so a red run stays red.

name: Secret Scanner

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    # The required context. See "The context name is deliberate" above.
    name: scan / gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Full history: the whole point is that a secret deleted in April is still
      # in a blob nobody will ever check out again.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Same pinned, checksum-verified binary the estate reusable used, so the
      # ruleset and therefore the findings are unchanged by this migration.
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.18.4
          SHA256=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          mkdir -p "$RUNNER_TEMP/bin"
          mv gitleaks "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      # Restore the newest ledger with this ruleset's prefix, then save under a
      # per-run key: the archive grows by whatever this run proved, and the next
      # run restores it. A key that hits would never save, so the run id keeps
      # the cache accumulating instead of freezing at the first value.
      - name: Restore the scan ledger
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/secret-scan
          key: secret-scan-${{ runner.os }}-${{ hashFiles('.gitleaks.toml', 'scripts/secret_scan.sh', 'scripts/lib/content-cache.sh') }}-${{ github.run_id }}
          restore-keys: |
            secret-scan-${{ runner.os }}-${{ hashFiles('.gitleaks.toml', 'scripts/secret_scan.sh', 'scripts/lib/content-cache.sh') }}-
            secret-scan-${{ runner.os }}-

      # The control runs FIRST. If the gate cannot go red on a planted secret,
      # its verdict on the real tree means nothing, and that is the failure worth
      # reporting -- not a green tick nobody can trust.
      - name: Control -- a planted secret must fail the scan
        run: ./tests/secret_scan_self_test.sh --scanner "$(command -v gitleaks)"

      - name: Scan every blob in history
        id: scan
        run: |
          set +e
          ./scripts/secret_scan.sh --cache .cache/secret-scan 2>&1 | tee scan.log
          rc="${PIPESTATUS[0]}"
          set -e
          exit "$rc"

      - name: Publish readable evidence
        if: always()
        run: |
          set +e
          {
            echo '## Secret scan'
            echo '```text'
            tail -30 scan.log 2>/dev/null || echo 'the scan produced no output'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit 0

      # Annotations are what the checks API returns to a pull request; the step
      # summary is only visible in the run UI. Only on failure -- an error
      # annotation on a green run would be a lie.
      - name: Annotate the failure
        if: failure()
        run: |
          set +e
          if test -f scan.log; then
            grep -E '^(secret-scan|  )' scan.log | tail -20 | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
          else
            echo '::error::the secret scan never produced output -- inspect the preceding steps'
          fi
          exit 0
