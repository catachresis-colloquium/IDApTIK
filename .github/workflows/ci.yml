        with:
          otp-version: "28.3.1"
          elixir-version: "1.19.5"
      - name: Install just (task runner, same recipe as local)
        run: cargo install just --version 1.46.0 --locked
      - name: just loopback-check (Burble + ADR-0006 §4 gate)
        run: just loopback-check
      # ADR-0017 real-relay leg: confirms the in-process relay model against
      # the same throwaway local burble (loopback only, guest dummy
      # identity, bounded frames). Reuses the checkout and BEAM toolchain
      # above; run: step only, so the actions.lock set is unchanged.
      - name: just evil-weevil-relay-check (model vs pinned GameChannel)
        run: just evil-weevil-relay-check

