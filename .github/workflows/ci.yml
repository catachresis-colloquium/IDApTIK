# This workflow is managed by gh actions-lock.
# Build + test CI for IDApTIK. These jobs mirror the real local gates:
#
#   just test-ghost           -> cargo test (core/tui/ffi/net/evil-weevil) + clippy -D warnings + fmt --check
#   just evil-weevil-check    -> ADR-0017 deterministic adversarial corpus (offline, no sockets)
#   just config-scenario-check -> Nickel export round-trips through the Rust
#                                 validator AND every bad_*.ncl fixture is rejected
#   Bevy frontend             -> selected renderer tests + warnings-as-errors Clippy
#   session loopback          -> relay tests + two-seat determinism/resync
#   fixture suites            -> offline shell, toolchain, coordination, and migration fixtures
#   must-check                -> K9 Must component physical-state probes
#   machine-readable          -> pinned DEED/K9/Nickel and coordination checks
#
# The Rust toolchain (channel + clippy/rustfmt/rust-src + wasm32 target) is pinned
# by rust-toolchain.toml, which rustup installs automatically on first use.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Present so issue #142's acceptance criterion 2 can be discharged WITHOUT two
  # real merges to main: trigger two runs back to back from the Actions tab and
  # both must reach a terminal verdict. Under the old ref-keyed group the second
  # cancelled the first; under the run-id group below neither can.
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# ── CONCURRENCY: supersede a PULL REQUEST, never a commit on main (issue #142) ──
#
# This used to be `group: ci-${{ github.ref }}` with `cancel-in-progress: true`
# at workflow level, which applied to pushes on main too. The abi-model job below
# builds Chez Scheme and Idris2 0.8.0 from source and takes 8-14 minutes
# (measured; the comment on that job still claims 20-25). A second merge landing
# inside that window cancelled the first run, and `abi-model` reported
# `cancelled` -- neither pass nor fail, but NO VERDICT AT ALL on that commit.
#
# Measured on main, last 13 completed abi-model outcomes as of 2026-09-22:
# 8 success, 3 cancelled, 2 failure. The cancellations cluster exactly where
# merges landed inside its runtime, e.g. PR #138's run 3f858fa3 started 11:51:11Z
# and was cancelled 12:01:28Z by PR #140's push at 12:00:59Z -- with its
# "ABI model gate" step SKIPPED, never executed.
#
# `cancelled` is read as "not red" by almost everything that consumes check
# results, so a merge burst silently produced commits on main where the Idris2
# ABI gate rendered no opinion while the commit still looked acceptable. The
# blind window was exactly when changes were landing.
#
# The fix scopes cancellation to the event that benefits from it. Superseding an
# in-flight PULL REQUEST run is worth having: the old head is about to be
# replaced and nobody will read its verdict. Superseding a PUSH discards a
# verdict nothing will ever recompute, because the commit is already on main.
# So pushes and dispatches get a group per RUN, which is unique, and cannot be
# cancelled by anything.
#
# NO NEW `uses:` ENTRY, which is #142's acceptance criterion 3: the estate
# manages actions through .github/workflows/actions.lock, and a ref the lockfile
# does not record makes the whole workflow unstartable (see lock-sync-gate.yml).
# This change touches no action reference at all.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Shell fixture suites + K9 Must probes. The pinned Rust toolchain is needed
  # for rustfmt; this gate runs before the slower compiler/bootstrap jobs.
  # Preserve the established check-run name for branch-protection compatibility;
  # "Mustfile probes" is a historical label, while the runner below reads K9.
  fixtures-and-must:
    name: fixtures-and-must (shell suites + Mustfile probes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach --force FETCH_HEAD
      - name: Provision pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Shell fixture suites (doctor, launcher, vendor gate)
        run: |
          bash tests/runtime_doctor_test.sh
          bash tests/launcher_fixture_test.sh
          bash tests/vendor_winit_check_test.sh
      # Issues #141 and its sibling. Two suites were committed under tests/ at
      # mode 100755 and wired into NOTHING -- no justfile recipe, no workflow
      # step -- so each provided zero protection while reading as coverage in
      # the tree and on the pull request. That is strictly worse than no test:
      # a reviewer seeing tests/abi_authority_pin_test.sh reasonably assumes the
      # ABI authority pins are regression-guarded when they are not.
      #
      # Both are offline: stubbed curl/sha256sum for the pin suite, and pure
      # YAML structure for the CI-configuration suite. They need no Idris2, no
      # Rust, and no network, which is why they live in this job rather than
      # beside the 8-14 minute abi-model bootstrap.
      #
      # `bash tests/...` rather than `./tests/...` here on purpose: unlike the
      # two gates below, these are not scripts whose executable bit is itself
      # the claim being made, and invoking them the way the justfile does keeps
      # `just fixture-tests` and this job reading the same command.
      # The environment, its tool versions and its Rust pin are three files.
      # Before this step they had already drifted: guix.scm provided neither
      # Nickel nor a container runtime, and provided a bare `rust` that would
      # shadow rust-toolchain.toml. The self-test plants eight defects -- one of
      # which found a control with a pass branch and no fail branch, in the very
      # script written to catch that defect.
      - name: Toolchain parity check (guix.scm, mise.toml, rust-toolchain.toml)
        run: bash scripts/toolchain-parity.sh --self-test
      - name: ABI authority pin fixtures (issue #141, was invoked by nothing)
        run: bash tests/abi_authority_pin_test.sh
      - name: CI security configuration fixtures (was invoked by nothing)
        run: bash tests/ci_security_config_test.sh
      # The .well-known/ publish step in pages.yml runs under dash inside a
      # Nix-based container with no bash and no guaranteed coreutils. PR #147
      # widened that step, reached for basename(1) and head(1), and failed on
      # main with "Process completed with exit code 1" and no retrievable log --
      # the Pages deploy went dark and the only evidence was an exit code.
      #
      # This suite extracts the step text from pages.yml and runs it under dash
      # with a PATH containing only mkdir, cp and cat, the three external
      # commands the previous version of the step already proved are present in
      # that container. A revision that needs a fourth one fails here in about a
      # second instead of failing on main with no log. It has a firing mutant
      # that reintroduces basename(1) and asserts it fails FOR THAT REASON, so
      # the minimal PATH cannot silently stop being minimal.
      #
      # dash is /bin/sh on ubuntu-latest, so this needs no setup step. It fails
      # closed rather than skipping if dash is somehow absent.
      - name: Pages .well-known publish fixtures (dash + minimal PATH)
        run: bash tests/pages_wellknown_test.sh
      # Duplicate of .github/workflows/lock-sync-gate.yml, deliberately. That
      # workflow carries no `uses:` and so cannot die the way it detects; this
      # copy exists so `just fixture-tests` and CI run the identical set, and so
      # a desync is still reported here if that gate is ever skipped. One awk
      # pass over ten small files, about a second.
      - name: Actions lockfile synchronisation (issue #142 class of failure)
        run: ./scripts/check-lock-sync.sh
      - name: Coordination K9 structural fixtures
        run: bash tests/coordination_k9_check_test.sh
      - name: Machine-readable migration layout fixtures
        run: bash tests/machine_readable_migration_test.sh
      - name: K9 Must component physical-state probes
        run: bash scripts/must_check.sh
      - name: K9 Must probe rejection fixtures
        run: bash tests/must_check_test.sh
      # The proof-escape scan needs no Idris2 toolchain, so it lives here
      # rather than in abi-model: a `believe_me` is then caught on every
      # pull request, not only on the ones where the 20-25 minute compiler
      # bootstrap runs. Invoked as ./scripts/... on purpose -- `bash script`
      # ignores the file mode, so a script committed 100644 passes every
      # local run and dies at exit 126 in CI. Running it directly makes the
      # executable bit load-bearing and a mode regression fails here.
      - name: Proof-escape gate self-test (the gate must be able to fail)
        run: ./scripts/idris_escape_scan.sh --self-test
      - name: Proof-escape scan (Idris2 ABI model)
        run: ./scripts/idris_escape_scan.sh
      # Documentation claims (issue #119). Same placement and same ./scripts/
      # invocation as the proof-escape gate above, for the same two reasons:
      # no toolchain is needed, so a false digest or a lying step name is
      # caught on every pull request; and running the file directly keeps the
      # executable bit load-bearing, so a 100644 regression dies here at exit
      # 126 rather than passing silently under `bash script`.
      - name: Documentation-claims gate self-test (the gate must be able to fail)
        run: ./scripts/doc_claims_check.sh --self-test
      - name: Documentation-claims scan (digest coverage + step-name claims)
        run: ./scripts/doc_claims_check.sh

  machine-readable-conformance:
    name: machine-readable (DEED, K9, Nickel, coordination)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach --force FETCH_HEAD
      - name: Pinned DEED/K9 and coordination conformance
        run: |
          set +e
          bash scripts/machine_readable_check.sh > /tmp/machine-readable.log 2>&1
          rc=$?
          set -e
          cat /tmp/machine-readable.log
          if [ "$rc" -ne 0 ]; then
            detail="$(tail -n 30 /tmp/machine-readable.log | tr '\n' ' ' | sed 's/[[:space:]][[:space:]]*/ /g')"
            echo "::error::machine-readable rc=$rc -- $detail"
            exit "$rc"
          fi

# Idris2 ABI model gate (issue #103): bootstrap Idris 2 0.8.0 with a source
# built Chez (no system deps beyond libc), then run the model gate.
#
# Deliberately no actions/cache (and no new `uses:` entries): the estate
# manages actions through .github/workflows/actions.lock, and the toolchain
# build is deterministic. Cost: 8-14 minutes measured on a standard runner
# (issue #142); an earlier revision of this comment claimed 20-25, which was
# pessimistic and is corrected here rather than left to be rediscovered.
  abi-model:
    name: abi-model (Idris2 gate)
    runs-on: ubuntu-latest
    # Observed 8-14 minutes end to end (issue #142), not the 20-25 the comment
    # below claims. 45 leaves headroom for a slow runner without letting a hung
    # Chez build hold it for the 6-hour default now that pushes cannot cancel.
    timeout-minutes: 45
    env:
      # The single constant both halves agree on. scripts/abi_model_check.sh
      # searches this exact path (see its toolchain-resolution list), so the
      # wrapper must be written here and nowhere else.
      IDRIS2_BOOTSTRAP_BIN: /tmp/idris-bootstrap/bin
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach --force FETCH_HEAD
      - name: "Bootstrap Chez + Idris2 (recipe: crates/idaptik-ffi/abi/README.md)"
        run: |
          mkdir -p /tmp/idris-bootstrap && cd /tmp/idris-bootstrap
          git clone --depth 1 --branch v10.4.1 --recurse-submodules --shallow-submodules \
            https://github.com/cisco/ChezScheme.git ChezScheme
          cd ChezScheme
          ./configure --threads --disable-curses --disable-x11 \
            --installprefix=/tmp/idris-bootstrap/chez-native
          make -j"$(nproc)" && make install
          cd /tmp/idris-bootstrap
          git clone https://github.com/idris-lang/Idris2.git
          cd Idris2 && git checkout v0.8.0
          export PATH=/tmp/idris-bootstrap/chez-native/bin:$PATH
          export LD_LIBRARY_PATH=/tmp/idris-bootstrap/chez-native/lib
          # On a fresh clone, `make bootstrap` stops early building the RefC
          # support (gmp.h) before ever reaching the compiler stages. Building
          # the C support library first satisfies the bootstrap's support
          # target, so the bootstrap then runs stage 1 + stage 2 and only its
          # final install-refc step can fail - harmless for the Chez codegen.
          make -C support/c
          make bootstrap SCHEME=/tmp/idris-bootstrap/chez-native/bin/scheme || true
          test -x build/exec/idris2
          export IDRIS2_DATA=/tmp/idris-bootstrap/Idris2/support
          export IDRIS2_PREFIX=/tmp/idris-bootstrap/idris-install
          for lib in prelude base linear network; do
            (cd libs/$lib && ../../build/exec/idris2 --install $lib.ipkg)
          done
          # `make bootstrap` installs libidris2_support.so into the BOOTSTRAP's
          # own prefix (.../Idris2/bootstrap-build/idris2-0.8.0/lib) and nothing
          # ever places it in $IDRIS2_PREFIX, where the libraries above just
          # went. `idris2 --build` copies that library out of
          # <prefix>/idris2-0.8.0/lib into the generated <exe>_app/ dir, and the
          # generated launcher is what adds that dir to LD_LIBRARY_PATH -- but
          # scripts/abi_model_check.sh runs build/exec/abi-smoke DIRECTLY, so a
          # missing copy stays invisible until the binary loads. A prefix
          # holding packages but no lib/ therefore BUILDS clean and dies at run
          # time with `Exception: (while loading libidris2_support.so)`.
          # These are the same two install lines Idris2's own `install-support`
          # target uses; the `test -s` turns a future silent skip into a loud
          # bootstrap failure.
          mkdir -p "$IDRIS2_PREFIX/idris2-0.8.0/lib"
          install -m 755 support/c/libidris2_support.so "$IDRIS2_PREFIX/idris2-0.8.0/lib/"
          install -m 644 support/c/libidris2_support.a  "$IDRIS2_PREFIX/idris2-0.8.0/lib/"
          test -s "$IDRIS2_PREFIX/idris2-0.8.0/lib/libidris2_support.so"
          # Absolute, not cwd-relative: this block's cwd is
          # /tmp/idris-bootstrap/Idris2, so `mkdir -p bin` wrote the wrapper to
          # .../Idris2/bin/idris2 while scripts/abi_model_check.sh searches
          # /tmp/idris-bootstrap/bin/idris2 -- one directory apart (issue #124).
          mkdir -p "$IDRIS2_BOOTSTRAP_BIN"
          cat > "$IDRIS2_BOOTSTRAP_BIN/idris2" <<'WRAPPER'
          #!/usr/bin/env bash
          export PATH="/tmp/idris-bootstrap/chez-native/bin:$PATH"
          export LD_LIBRARY_PATH="/tmp/idris-bootstrap/chez-native/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export IDRIS2_DATA=/tmp/idris-bootstrap/Idris2/support
          # The prefix is the single thing every lookup derives from, so name it
          # explicitly instead of inheriting whatever prefix this binary was
          # compiled with. It resolves BOTH the installed packages and
          # <prefix>/idris2-0.8.0/lib, from which `--build` copies
          # libidris2_support.so into the generated <exe>_app/ directory.
          export IDRIS2_PREFIX=/tmp/idris-bootstrap/idris-install
          export IDRIS2_PACKAGE_PATH="/tmp/idris-bootstrap/idris-install/idris2-0.8.0${IDRIS2_PACKAGE_PATH:+:$IDRIS2_PACKAGE_PATH}"
          exec /tmp/idris-bootstrap/Idris2/build/exec/idris2 "$@"
          WRAPPER
          # (No de-indent pass: YAML strips the block scalar's common indentation,
          # so the heredoc body already lands at column 0.)
          chmod +x "$IDRIS2_BOOTSTRAP_BIN/idris2"
          # Prove the toolchain is COMPLETE here, in seconds, rather than 14
          # minutes later as a confusing loader error in the gate. This builds
          # and runs a trivial program exactly as scripts/abi_model_check.sh
          # does -- `--build`, then the produced binary invoked DIRECTLY, with
          # no launcher and no LD_LIBRARY_PATH of its own. Issue #124 was the
          # wrapper in the wrong place; this is the arm underneath it.
          probe=$(mktemp -d)
          printf 'module Main\nmain : IO ()\nmain = putStrLn "ok"\n' > "$probe/Main.idr"
          printf 'package probe\nmain = Main\nexecutable = probe\nsourcedir = "."\n' > "$probe/probe.ipkg"
          (cd "$probe" && "$IDRIS2_BOOTSTRAP_BIN/idris2" --build probe.ipkg)
          test "$("$probe/build/exec/probe")" = "ok"
          # Step environments do not survive into the next step; publish both the
          # PATH entry and an explicit IDRIS2 so the gate cannot miss the toolchain.
          echo "$IDRIS2_BOOTSTRAP_BIN" >> "$GITHUB_PATH"
          echo "IDRIS2=$IDRIS2_BOOTSTRAP_BIN/idris2" >> "$GITHUB_ENV"
      - name: ABI model gate
        run: bash scripts/abi_model_check.sh

  # Fails in seconds on a formatting problem, instead of after a full test and
  # clippy cycle. `just test-ghost` still ends with the same check, so the local
  # gate stays complete and this job is a fast path, not a replacement.
  #
  # Deliberately does not install `just`: the other jobs build it from source,
  # which costs minutes, and a formatting check needs nothing but rustfmt.
  fmt:
    name: fmt (rustfmt --check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      # checks: write publishes the rustfmt diff into this job's own check-run
      # output. `cargo fmt -- --check` prints the offending hunks to stdout and
      # exits 1; without this the failure is a bare "exit code 1" that no one
      # outside the runner can read.
      checks: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach --force FETCH_HEAD
      - name: Provision pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: cargo fmt --all -- --check
        run: |
          set +e
          cargo fmt --all -- --check > /tmp/fmt.out 2>&1
          rc=$?
          set -e
          cat /tmp/fmt.out
          if [ "$rc" -ne 0 ]; then
            # The diff comes first: a truncated annotation must show the hunks
            # that are actually unformatted, not the tail of a passing run.
            {
              echo '### cargo fmt --all -- --check failed (rc='"$rc"')'
              echo '```diff'
              head -n 120 /tmp/fmt.out
              echo '```'
            } > /tmp/fmt-detail.md
            cat /tmp/fmt-detail.md >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            detail="$(grep -nE '^Diff in |^error' /tmp/fmt.out | head -20 | tr '\n' ' ' | head -c 1200)"
            echo "::error::fmt rc=$rc -- $detail"
            cr_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "fmt (rustfmt --check)") | .id' 2>/dev/null | head -1)"
            if [ -n "$cr_id" ]; then
              jq -n --arg t "rustfmt found unformatted code" --arg rc "$rc" --rawfile body /tmp/fmt-detail.md \
                '{output: {title: ($t + " (rc=" + $rc + ")"), summary: $body}}' > /tmp/fmt_patch.json \
                && gh api --input /tmp/fmt_patch.json -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$cr_id" >/dev/null 2>&1 || true
            fi
            exit "$rc"
          fi

  supply-chain:
    name: supply-chain (cargo-deny)
    permissions:
      actions: read
      contents: read
      # checks: write is used only to publish this job's own failure detail
      # into its check-run output: this estate's runner pool does not expose
      # ::error:: annotations through the check-runs API (verified across 83
      # failed jobs), so without it the verdict of a failing gate is
      # unreadable by anyone without run-log access. The token writes only
      # this check-run's output.title/output.summary.
      checks: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach --force FETCH_HEAD
      - name: Provision pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check advisories, dependencies, licences, and sources
        run: |
          # Same failure-capture pattern as the vendor-parity step: cargo
          # deny's verdict exists only in the run log, which a remote
          # operator (or a sandbox without log egress) cannot read.
          set +e
          cargo deny check --hide-inclusion-graph 2>&1 | tee /tmp/deny_out.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            {
              echo '### cargo-deny failed (rc='"$rc"') -- last output lines'
              echo '```'
              tail -40 /tmp/deny_out.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            tail -40 /tmp/deny_out.txt > /tmp/cargo_deny_detail.md
            echo "::error::cargo-deny rc=$rc -- $(tail -3 /tmp/deny_out.txt | tr '\n' ' | ')"
            cr_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "supply-chain (cargo-deny)") | .id' 2>/dev/null | head -1)"
            if [ -n "$cr_id" ]; then
              jq -n --arg t "cargo-deny failed" --arg rc "$rc" --rawfile body /tmp/cargo_deny_detail.md \
                '{output: {title: ($t + " (rc=" + $rc + ")"), summary: ("```bash\n" + $body + "```")}}' > /tmp/cargo_deny_patch.json \
                && gh api --input /tmp/cargo_deny_patch.json -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$cr_id" >/dev/null 2>&1 || true
            fi
            exit "$rc"
          fi

  # Gate for the vendored bevy_winit feature patch (issue #105): source and
  # manifest parity with the published crate, font-parser-free resolved graph,
  # and the fixture coverage that keeps the gate itself honest. The bevy-frontend
  # job covers that the selected Wayland+X11 build actually compiles.
  vendor-parity:
    name: vendor-parity (bevy_winit patch gate)
    permissions:
      actions: read
      contents: read
      # checks: write is used only to publish this job's own failure detail
      # into its check-run output: this estate's runner pool does not expose
      # ::error:: annotations through the check-runs API (verified across 83
      # failed jobs), so without it the verdict of a failing gate is
      # unreadable by anyone without run-log access. The token writes only
      # this check-run's output.title/output.summary.
      checks: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach --force FETCH_HEAD
      - name: Provision pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Fixture self-test (clean + firing fixtures, no network)
        run: bash tests/vendor_winit_check_test.sh
      - name: Vendored copy matches the published crate
        run: |
          # Capture the raw exit code and the last lines of output: the
          # checker's own die() carries the detail, but any failure path that
          # slips past it (a set -e trip on an unguarded command) must still
          # be diagnosable without run-log access.
          set +e
          bash scripts/vendor_bevy_winit_check.sh parity 2>&1 | tee /tmp/parity_out.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            {
              echo '### vendor-parity failed (rc='"$rc"') -- last output lines'
              echo '```'
              tail -40 /tmp/parity_out.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            tail -40 /tmp/parity_out.txt > /tmp/vendor_parity_detail.md
            echo "::error::vendor-parity rc=$rc -- $(tail -3 /tmp/parity_out.txt | tr '\n' ' | ')"
            # Check-run output is the API-readable failure channel (see the
            # permissions note above). Best-effort: the step summary is the
            # fallback for UI readers either way.
            cr_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "vendor-parity (bevy_winit patch gate)") | .id' 2>/dev/null | head -1)"
            if [ -n "$cr_id" ]; then
              jq -n --arg t "vendor-parity failed" --arg rc "$rc" --rawfile body /tmp/vendor_parity_detail.md \
                '{output: {title: ($t + " (rc=" + $rc + ")"), summary: ("```bash\n" + $body + "```")}}' > /tmp/vendor_parity_patch.json \
                && gh api --input /tmp/vendor_parity_patch.json -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$cr_id" >/dev/null 2>&1 || true
            fi
            exit "$rc"
          fi
      - name: Font-parser-free graph with title-free CSD active
        run: |
          cp Cargo.lock /tmp/Cargo.lock.before
          set +e
          bash scripts/vendor_bevy_winit_check.sh graph > /tmp/vendor-graph.log 2>&1
          rc=$?
          set -e
          cat /tmp/vendor-graph.log
          if [ "$rc" -ne 0 ]; then
            set +e
            cargo metadata --format-version 1 > /tmp/unlocked-metadata.json 2> /tmp/unlocked-metadata.err
            metadata_rc=$?
            set -e
            if [ "$metadata_rc" -eq 0 ]; then
              diff -u /tmp/Cargo.lock.before Cargo.lock > /tmp/Cargo.lock.diff || true
              cat /tmp/Cargo.lock.diff
              detail="$(head -c 50000 /tmp/Cargo.lock.diff | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
              echo "::error::Cargo.lock diff proposed by unlocked metadata: $detail"
              {
                echo '### Cargo.lock diff proposed by unlocked cargo metadata'
                echo '```diff'
                cat /tmp/Cargo.lock.diff
                echo '```'
              } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              cr_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "vendor-parity (bevy_winit patch gate)") | .id' 2>/dev/null | head -1)"
              if [ -n "$cr_id" ]; then
                jq -n --arg title "Cargo.lock diff proposed by unlocked metadata" --rawfile body /tmp/Cargo.lock.diff \
                  '{output: {title: $title, summary: ("```diff\n" + $body + "```")}}' > /tmp/lock-drift-patch.json \
                  && gh api --input /tmp/lock-drift-patch.json -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$cr_id" >/dev/null 2>&1 || true
              fi
            else
              cat /tmp/unlocked-metadata.err
              detail="$(tail -n 30 /tmp/unlocked-metadata.err | tr '\n' ' ' | sed 's/[[:space:]][[:space:]]*/ /g')"
              echo "::error::unlocked cargo metadata also failed (rc=$metadata_rc) -- $detail"
            fi
            exit "$rc"
          fi

  test-ghost:
    name: test-ghost (core/tui/ffi + clippy + fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      # checks: write publishes this job's own failure detail into its check-run
      # output: annotations are capped at ~4 KB and the runner pool does not
      # expose ::error:: text through the API, so a truncated annotation used to
      # show 4 KB of *passing* test output before the actual failure.
      checks: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach --force FETCH_HEAD
      - name: Provision pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Install just (task runner, same recipe as local)
        run: cargo install just --version 1.46.0 --locked
      - name: just test-ghost
        run: |
          set +e
          just test-ghost > /tmp/test-ghost.log 2>&1
          rc=$?
          set -e
          cat /tmp/test-ghost.log
          if [ "$rc" -ne 0 ]; then
            # Lead with the diagnostic lines, not with the tail: the annotations
            # API keeps only the first ~4 KB, and the old tail-first capture spent
            # that budget on passing tests so the real failure was unreadable.
            {
              echo '### test-ghost failed (rc='"$rc"') -- error lines'
              echo '```'
              grep -nE '^(error(\[|:)|warning: unused|thread .main.|failures:|test .* FAILED)' /tmp/test-ghost.log | head -40 || true
              echo '```'
              echo '### last 25 lines'
              echo '```'
              tail -n 25 /tmp/test-ghost.log
              echo '```'
            } > /tmp/test-ghost-detail.md
            cat /tmp/test-ghost-detail.md >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            detail="$(tr '\n' ' ' < /tmp/test-ghost-detail.md | sed 's/[[:space:]][[:space:]]*/ /g' | head -c 3600)"
            echo "::error::test-ghost rc=$rc -- $detail"
            cr_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "test-ghost (core/tui/ffi + clippy + fmt)") | .id' 2>/dev/null | head -1)"
            if [ -n "$cr_id" ]; then
              jq -n --arg t "test-ghost failed" --arg rc "$rc" --rawfile body /tmp/test-ghost-detail.md \
                '{output: {title: ($t + " (rc=" + $rc + ")"), summary: $body}}' > /tmp/test_ghost_patch.json \
                && gh api --input /tmp/test_ghost_patch.json -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$cr_id" >/dev/null 2>&1 || true
            fi
            exit "$rc"
          fi
      # ADR-0017 Evil Weevil offline gate: the full adversarial corpus
      # (binary, redacted artifacts, secret-shape and byte-identical
      # determinism gates), not only the crate's tests already run above.
      # run: step only — no new actions reference, per the actions.lock rule.
      - name: just evil-weevil-check (deterministic adversarial corpus)
        run: just evil-weevil-check

  bevy-frontend:
    name: bevy-frontend (tests + clippy)
    permissions:
      actions: read
      contents: read
      # checks: write is used only to publish this job's own failure detail
      # into its check-run output: this estate's runner pool does not expose
      # ::error:: annotations through the check-runs API (verified across 83
      # failed jobs), so without it the verdict of a failing gate is
      # unreadable by anyone without run-log access. The token writes only
      # this check-run's output.title/output.summary.
      checks: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach --force FETCH_HEAD
      - name: Provision pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Install Bevy Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Test selected frontend
        run: |
          set +e
          cargo test -p idaptik-bevy 2>&1 | tee /tmp/bevy_test.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            {
              echo '### bevy-frontend cargo test failed (rc='"$rc"')'
              echo '```'
              grep -n -m 4 -A 12 -E '^error' /tmp/bevy_test.txt | head -70
              echo '--- tail ---'
              tail -15 /tmp/bevy_test.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            { grep -m 4 -A 12 -E '^error' /tmp/bevy_test.txt | head -70; echo '--- tail ---'; tail -15 /tmp/bevy_test.txt; } > /tmp/bevy_test_detail.md
            echo "::error::bevy-test rc=$rc -- $(grep -m1 -E '^error' /tmp/bevy_test.txt | head -c 300)"
            cr_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "bevy-frontend (tests + clippy)") | .id' 2>/dev/null | head -1)"
            if [ -n "$cr_id" ]; then
              jq -n --arg t "bevy-frontend test failed" --arg rc "$rc" --rawfile body /tmp/bevy_test_detail.md \
                '{output: {title: ($t + " (rc=" + $rc + ")"), summary: ("```bash\n" + $body + "```")}}' > /tmp/bevy_test_patch.json \
                && gh api --input /tmp/bevy_test_patch.json -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$cr_id" >/dev/null 2>&1 || true
            fi
            exit "$rc"
          fi
      - name: Lint selected frontend
        run: |
          set +e
          cargo clippy -p idaptik-bevy --all-targets -- -D warnings 2>&1 | tee /tmp/bevy_clippy.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            {
              echo '### bevy-frontend clippy failed (rc='"$rc"')'
              echo '```'
              grep -n -m 4 -A 12 -E '^(error|warning: unused|error\[)' /tmp/bevy_clippy.txt | head -70
              echo '--- tail ---'
              tail -15 /tmp/bevy_clippy.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            { grep -m 4 -A 12 -E '^(error|warning: unused|error\[)' /tmp/bevy_clippy.txt | head -70; echo '--- tail ---'; tail -15 /tmp/bevy_clippy.txt; } > /tmp/bevy_clippy_detail.md
            echo "::error::bevy-clippy rc=$rc -- $(grep -m1 -E '^error' /tmp/bevy_clippy.txt | head -c 300)"
            cr_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "bevy-frontend (tests + clippy)") | .id' 2>/dev/null | head -1)"
            if [ -n "$cr_id" ]; then
              jq -n --arg t "bevy-frontend clippy failed" --arg rc "$rc" --rawfile body /tmp/bevy_clippy_detail.md \
                '{output: {title: ($t + " (rc=" + $rc + ")"), summary: ("```bash\n" + $body + "```")}}' > /tmp/bevy_clippy_patch.json \
                && gh api --input /tmp/bevy_clippy_patch.json -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$cr_id" >/dev/null 2>&1 || true
            fi
            exit "$rc"
          fi

  session-loopback:
    name: session-loopback (Burble relay + two-seat determinism gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Known-compatible game-session lane plus the post-merge socket fixes.
      BURBLE_REF: ef6756cf1591406d434c5c04c3c018e935836e4c
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach --force FETCH_HEAD
      - name: Checkout pinned Burble game-session fabric
        run: |
          git init ../burble
          git -C ../burble remote add origin https://github.com/metadatastician/burble.git
          git -C ../burble fetch --no-tags --depth=1 origin "$BURBLE_REF"
          git -C ../burble checkout --detach --force FETCH_HEAD
      - name: Provision pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Provision Erlang/Elixir (versions mirror mise.toml)
