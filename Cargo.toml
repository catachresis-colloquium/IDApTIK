# IDApTIK Cargo workspace.
#
# Layout follows ADR-0003: gameplay truth lives in an engine-agnostic `core`
# crate; `bevy` is the selected rendering frontend over it; `ffi` is the C-ABI
# surface, modelled in Idris2 under ffi/abi/ (gated by just abi-model-check);
# the Zig adapter over it lives in crates/idaptik-ffi/zig-adapter/ (gated by
# .github/workflows/abi-conformance.yml), see issue #103 (ADR-0001, ADR-0008).
[workspace]
resolver = "2"
members = [
    "crates/idaptik-kernel",
    "crates/idaptik-core",
    "crates/idaptik-ffi",
    "crates/idaptik-tui",
    "crates/idaptik-net",
    "crates/idaptik-evil-weevil",
    "crates/idaptik-bevy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["IDApTIK contributors"]
repository = "https://github.com/metadatastician/IDApTIK"

[workspace.dependencies]
idaptik-kernel = { path = "crates/idaptik-kernel", version = "0.1.0" }
idaptik-core = { path = "crates/idaptik-core", version = "0.1.0" }
idaptik-tui = { path = "crates/idaptik-tui", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` guarantees bit-exact f64 JSON round-trips (snapshots/exports).
serde_json = { version = "1", features = ["float_roundtrip"] }
libm = "0.2"
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
bevy = "0.20"
bevy_winit = { version = "0.20.0", default-features = false, features = ["wayland-csd-adwaita-notitle"] }
# The client-side session transport (ADR-0006 §2): async runtime + WebSocket.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
idaptik-net = { path = "crates/idaptik-net", version = "0.1.0" }
burble-client = { git = "https://github.com/metadatastician/burble", rev = "ef6756cf1591406d434c5c04c3c018e935836e4c", version = "2.0.0" }
tokio-tungstenite = "0.30"
futures-util = "0.3"

# Debug builds of the Bevy dependency tree carry gigabytes of DWARF; linking that
# into idaptik-bevy thrashes a ~4 GiB WSL2 VM for hours without finishing. Keep
# full debug info for IDApTIK's own crates, drop it for third-party ones.
#
# Optimise the dependencies too. Unoptimised Bevy costs several CPU cores to
# draw a 2D cross-section; built once at opt-level 3 it is cheap to run, and
# incremental builds of our own crates stay quick. Our crates get opt-level 1
# so dev runs are smooth without slowing the edit-compile loop much. Float
# semantics are unchanged at any opt-level (no fast-math), so determinism holds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
debug = false
opt-level = 3

[patch.crates-io]
bevy_winit = { path = "vendor/bevy_winit" }
