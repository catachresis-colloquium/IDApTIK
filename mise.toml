# Toolchain pins for IDApTIK, managed by mise (https://mise.jdx.dev).
# Rust is pinned separately by rust-toolchain.toml so cargo, rust-analyzer,
# clippy, and rustfmt resolve identically in editors and CI.

[tools]
# Multiplayer/session layer
erlang = "28.3.1"
elixir = "1.19.5-otp-28"

# FFI, configuration, and task runner
zig = "0.14.0"
just = "1.46.0"
"aqua:mikefarah/yq" = "4.53.3"
jq = "1.8.1"
"aqua:nickel-lang/nickel" = "1.16.0"
"aqua:trufflesecurity/trufflehog" = "3.96.0"

# Idris2 is provisioned on demand with `just install-idris2`; it requires a
# Scheme backend and is not part of the day-to-day game-development toolchain.

[env]
RUST_BACKTRACE = "1"
